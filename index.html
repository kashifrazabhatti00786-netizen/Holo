<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Particle Interface</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- Three.js Module Import -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <video id="webcam" playsinline muted></video>

  <div id="hud-container">
    <div class="hud-panel">
      <div class="hud-header">
        <span class="hud-title">PARTICLE INTERFACE</span>
        <span class="status-pulse" id="status-dot"></span>
      </div>
      <div class="hud-body">
        <div class="hud-row">
          <span class="hud-label">Tracking</span>
          <span class="hud-value" id="hud-tracking">Searching...</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Gesture</span>
          <span class="hud-value gesture-active" id="hud-gesture">None</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Mode</span>
          <span class="hud-value mode-active" id="hud-mode">Idle</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Depth Level</span>
          <span class="hud-value level-active" id="hud-depth">L0 [Macro Universe]</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Selected Target</span>
          <span class="hud-value" id="hud-selected">None</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Travel Progress</span>
          <span class="hud-value" id="hud-progress">0%</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Zoom Scale</span>
          <span class="hud-value" id="hud-zoom">100%</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Status</span>
          <span class="hud-value status-active" id="hud-status">Graphics Initialised</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">FPS</span>
          <span class="hud-value" id="hud-fps">--</span>
        </div>
      </div>
    </div>
  </div>

  <div id="error-dialog" class="error-panel hidden">
    <div class="error-title" id="error-title">SYSTEM ALERT</div>
    <div class="error-message" id="error-text">System notice.</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
