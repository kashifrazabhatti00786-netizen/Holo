<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Particle Interface</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="hud-container">
    <div class="hud-panel">
      <div class="hud-header">
        <span class="hud-title">PARTICLE INTERFACE</span>
        <span class="status-pulse"></span>
      </div>
      <div class="hud-body">
        <div class="hud-row">
          <span class="hud-label">Tracking</span>
          <span class="hud-value" id="hud-tracking">Waiting...</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Status</span>
          <span class="hud-value status-active" id="hud-status">Graphics Initialised</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">FPS</span>
          <span class="hud-value" id="hud-fps">--</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Particles</span>
          <span class="hud-value" id="hud-particles">80,000</span>
        </div>
      </div>
    </div>
  </div>

  <div id="error-dialog" class="error-panel hidden">
    <div class="error-title">GRAPHICS ERROR</div>
    <div class="error-message" id="error-text">WebGL is not supported on this device or browser.</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
